def pocJavaVersion = JavaLanguageVersion.of(21)
def pocJava = javaToolchains.launcherFor {
    languageVersion = pocJavaVersion
}

repositories {
    maven {
        url = uri(providers.gradleProperty('sdkJavaPocRepo')
                .getOrElse("${rootProject.projectDir}/../sdk-java-poc/build/maven-repository"))
        content {
            includeModule('io.temporal', 'sdk-java-poc')
        }
    }
}

sourceSets {
    poc {
        java.srcDir 'src/main/java'
        resources.srcDir 'src/main/resources'
        // The POC does not expose Workflow.sideEffect.
        java.exclude 'io/temporal/samples/hello/HelloSideEffect.java'
    }
}

configurations.pocImplementation.extendsFrom(configurations.implementation)
configurations.pocRuntimeOnly.extendsFrom(configurations.runtimeOnly)
[configurations.pocCompileClasspath, configurations.pocRuntimeClasspath].each {
    it.exclude group: 'io.temporal', module: 'temporal-sdk'
    it.exclude group: 'io.temporal', module: 'temporal-serviceclient'
}

dependencies {
    // Temporal SDK
    implementation "io.temporal:temporal-sdk:$javaSDKVersion"
    implementation "io.temporal:temporal-opentracing:$javaSDKVersion"
    testImplementation("io.temporal:temporal-testing:$javaSDKVersion")
    pocImplementation 'io.temporal:sdk-java-poc:0.1.0-SNAPSHOT'
    pocImplementation platform('io.micrometer:micrometer-bom:1.9.9')
    pocImplementation 'io.grpc:grpc-util'

    // Environment configuration
    implementation "io.temporal:temporal-envconfig:$javaSDKVersion"

    // Needed for SDK related functionality
    implementation(platform("com.fasterxml.jackson:jackson-bom:2.17.2"))
    implementation "com.fasterxml.jackson.core:jackson-databind"
    implementation "com.fasterxml.jackson.core:jackson-core"

    implementation "io.micrometer:micrometer-registry-prometheus"

    implementation group: 'ch.qos.logback', name: 'logback-classic', version: '1.5.6'
    implementation group: 'com.jayway.jsonpath', name: 'json-path', version: '2.9.0'

    implementation(platform("io.opentelemetry:opentelemetry-bom:$otelVersion"))
    implementation "io.opentelemetry:opentelemetry-sdk"
    implementation "io.opentelemetry:opentelemetry-exporter-jaeger"
    implementation "io.opentelemetry:opentelemetry-extension-trace-propagators"
    implementation "io.opentelemetry:opentelemetry-opentracing-shim:$otelVersionAlpha"
    implementation "io.opentelemetry:opentelemetry-semconv:$otelVersionAlpha"
    implementation 'io.jaegertracing:jaeger-client:1.8.1'

    // Used in samples
    implementation group: 'commons-configuration', name: 'commons-configuration', version: '1.10'
    implementation group: 'io.cloudevents', name: 'cloudevents-core', version: '4.0.1'
    implementation group: 'io.cloudevents', name: 'cloudevents-api', version: '4.0.1'
    implementation group: 'io.cloudevents', name: 'cloudevents-json-jackson', version: '3.0.0'
    implementation group: 'net.thisptr', name: 'jackson-jq', version: '1.0.0-preview.20240207'
    implementation group: 'commons-cli', name: 'commons-cli', version: '1.9.0'

    // Used in AWS Encryption SDK sample
    implementation group: 'com.amazonaws', name: 'aws-encryption-sdk-java', version: '3.0.1'
    implementation("software.amazon.cryptography:aws-cryptographic-material-providers:1.0.2")
    implementation(platform("software.amazon.awssdk:bom:2.20.91"))
    implementation("software.amazon.awssdk:kms")
    implementation("software.amazon.awssdk:dynamodb")

    // we don't update it to 2.1.0 because 2.1.0 requires Java 11
    implementation 'com.codingrodent:jackson-json-crypto:1.1.0'

    testImplementation "junit:junit:4.13.2"
    testImplementation "org.mockito:mockito-core:5.12.0"

    testImplementation(platform("org.junit:junit-bom:5.10.3"))
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly "org.junit.vintage:junit-vintage-engine"

    dependencies {
        errorproneJavac('com.google.errorprone:javac:9+181-r4173-1')
        errorprone('com.google.errorprone:error_prone_core:2.28.0')
    }
}

tasks.named('compilePocJava', JavaCompile) {
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = pocJavaVersion
    }
    options.release = pocJavaVersion.asInt()
}

tasks.register('execute', JavaExec) {
    mainClass = providers.gradleProperty('mainClass')
    classpath = sourceSets.poc.runtimeClasspath
    javaLauncher = pocJava
    jvmArgs '-Xss16m'
}

tasks.register('verifyTimerRestart', Exec) {
    description = 'Verifies that the timer workflow completes after its worker JVM restarts.'
    group = 'verification'
    dependsOn tasks.named('pocClasses')
    doFirst {
        commandLine 'python3', 'verify_restart.py',
                '--java', pocJava.get().executablePath.asFile.absolutePath,
                '--classpath', sourceSets.poc.runtimeClasspath.asPath
    }
}
