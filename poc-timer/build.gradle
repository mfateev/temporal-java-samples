plugins {
    id 'application'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        url = uri(providers.gradleProperty('sdkJavaPocRepo')
                .getOrElse("${rootDir}/../../sdk-java-poc/build/maven-repository"))
        content {
            includeModule('io.temporal', 'sdk-java-poc')
        }
    }
    mavenCentral()
}

dependencies {
    implementation 'io.temporal:sdk-java-poc:0.1.0-SNAPSHOT'
}

application {
    mainClass = 'io.temporal.samples.poc.HelloPocTimer'
    applicationDefaultJvmArgs = ['-Xss16m']
}

sourceSets {
    existingSamples {
        java {
            srcDir '../core/src/main/java'
            include 'io/temporal/samples/hello/HelloQuery.java',
                    'io/temporal/samples/hello/HelloSignal.java',
                    'io/temporal/samples/workerversioning/*.java'
        }
    }
}

configurations.existingSamplesImplementation.extendsFrom(configurations.implementation)

dependencies {
    existingSamplesImplementation 'io.temporal:temporal-envconfig:1.32.1'
    existingSamplesRuntimeOnly 'org.slf4j:slf4j-simple:1.7.36'
}

def existingSampleMainClasses = [
    runHelloQuery: 'hello.HelloQuery',
    runHelloSignal: 'hello.HelloSignal',
    runVersioningStarter: 'workerversioning.Starter',
    runWorkerV1: 'workerversioning.WorkerV1',
    runWorkerV1_1: 'workerversioning.WorkerV1_1',
    runWorkerV2: 'workerversioning.WorkerV2',
]

existingSampleMainClasses.each { taskName, sample ->
    tasks.register(taskName, JavaExec) {
        group = 'application'
        description = "Run ${sample} with the Core-backed SDK."
        javaLauncher = javaToolchains.launcherFor(java.toolchain)
        classpath = sourceSets.existingSamples.runtimeClasspath
        mainClass = "io.temporal.samples.${sample}"
        jvmArgs application.applicationDefaultJvmArgs
    }
}
